; merge.conf
; bin/merge.php の設定ファイル
; セクション名は任意の識別子
; entry  = エントリポイントのPHPファイル（プロジェクトルートからの相対パス）
; output = 出力先ファイル（プロジェクトルートからの相対パス）

[openvpn-ldap-plus-auth]
entry = src/openvpn-ldap-plus-auth.php
output = dist/openvpn-ldap-plus-auth.php

[ovpn-user]
entry = src/ovpn-user.php
output = dist/ovpn-user.php
